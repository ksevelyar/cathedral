name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v27
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: nix develop --command cargo build --verbose

      - name: Format check
        run: nix develop --command cargo fmt --all -- --check --color always

      - name: Clippy
        run: nix develop --command cargo clippy --all-features --workspace -- -D warnings

      - name: Test
        run: nix develop --command cargo test --verbose
