[package]
name = "cathedral"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["wayland", "mp3"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
