[package]
name = "cathedral"
version = "0.3.0"
edition = "2024"

[dependencies]
avian3d = "0.7"

[dependencies.bevy]
version = "0.19.0"
default-features = false
features = [
  "async_executor",
  "bevy_animation",
  "bevy_asset",
  "bevy_audio",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_gizmos_render",
  "bevy_gltf",
  "bevy_image",
  "bevy_light",
  "bevy_log",
  "bevy_material",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_picking",
  "bevy_render",
  "bevy_shader",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_ui_widgets",
  "bevy_window",
  "bevy_winit",
  "bevy_world_serialization",
  "default_font",
  "gltf_animation",
  "ktx2",
  "mp3",
  "multi_threaded",
  "png",
  "reflect_auto_register",
  "std",
  "tonemapping_luts",
  "wayland",
  "zstd_rust",
]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
