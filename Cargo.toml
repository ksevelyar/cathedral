[package]
name = "cathedral"
version = "0.6.0"
edition = "2024"
default-run = "cathedral"

[lib]
test = false

[[bin]]
name = "cathedral"
path = "src/main.rs"
test = false

[[bench]]
name = "bloodmarks"
harness = false

[[bin]]
name = "screenshot"
path = "src/bin/screenshot.rs"
test = false
required-features = ["tools"]

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"
test = false
required-features = ["tools"]

[features]
tools = []

[dependencies]
avian3d = "0.7"
jiff = "0.2"
rand = "0.10"

[dev-dependencies]
criterion = "0.8.2"

[dependencies.bevy]
version = "0.19.0"
default-features = false
features = [
  "async_executor",
  "bevy_animation",
  "bevy_asset",
  "bevy_audio",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_gizmos_render",
  "bevy_gltf",
  "bevy_image",
  "bevy_light",
  "bevy_log",
  "bevy_material",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_picking",
  "bevy_post_process",
  "bevy_render",
  "bevy_shader",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_ui_widgets",
  "bevy_window",
  "bevy_winit",
  "bevy_world_serialization",
  "debug",
  "default_font",
  "gltf_animation",
  "jpeg",
  "ktx2",
  "mp3",
  "multi_threaded",
  "png",
  "reflect_auto_register",
  "std",
  "tonemapping_luts",
  "wayland",
  "zstd_rust",
]

[profile.test]
debug = "line-tables-only"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
needless_pass_by_value = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
